    description: "How roughly the collar goes on: forcefully, normally, or gently."
  - type: dynamic
    name: leashDistance
    description: "How long the leash is: tight (almost no slack), short, middle, or long."
  - type: dynamic
    name: leashType
    description: "What the leash is made of: chain, rope, or magic. Wrists is chain only."
  - type: dynamic
    name: body_part
    description: "Where the collar attaches: neck, wrists, or waist. Wrists uses the chain hand mesh."
