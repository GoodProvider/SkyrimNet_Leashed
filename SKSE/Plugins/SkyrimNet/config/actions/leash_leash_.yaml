customCategory: leash_leash
name: leash_leash
label: Leash
description: "Put a collar and leash on a nearby person or on yourself — hold the leash, leave it hanging, or tie them to a point. Not for changing or removing an existing leash."
parameterMapping:
  - type: dynamic
    name: intent
    description: Who gets the leash, who holds it (or None / tied), how, and why. Example — put a rope leash on Tom's neck and hold it myself because he asked to be led.
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: is_leash_available
        arguments:
          - currentActor
        comparisonOperator: ==
        expectedValue: "available"
    logicalOperator: AND
    required: true
  - conditions:
      - decoratorName: unleashed_nearby
        arguments:
          - currentActor
        comparisonOperator: ==
        expectedValue: "available"
      - decoratorName: speaker_is_leashed
        arguments:
          - currentActor
        comparisonOperator: ==
        expectedValue: "unavailable"
    logicalOperator: OR
    required: true
