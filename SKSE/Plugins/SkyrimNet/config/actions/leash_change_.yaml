customCategory: leash_change
name: leash_change
label: Change leash
description: "Take, give, or re-tie an existing leash. Hand it to someone else, take it yourself, leave it hanging, or fasten it to a nearby point. Not for putting a new leash on, and not for taking one off."
parameterMapping:
  - type: dynamic
    name: intent
    description: Who holds the existing leash after the change, where it is tied, and why. Example — take Tom's leash from Nina so I can lead him.
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: is_leash_available
        arguments:
          - currentActor
        comparisonOperator: ==
        expectedValue: "available"
    logicalOperator: AND
    required: true
  - conditions:
      - decoratorName: collared_nearby
        arguments:
          - currentActor
        comparisonOperator: ==
        expectedValue: "available"
      - decoratorName: speaker_is_leashed
        arguments:
          - currentActor
        comparisonOperator: ==
        expectedValue: "available"
    logicalOperator: OR
    required: true
