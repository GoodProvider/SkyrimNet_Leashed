customCategory: leash_leash
name: leash_leash_tie_target
description: "{{render_template(\"leash_actions/leash_action_leash_tie_target\")}}"
questEditorId: SkyrimNet_Leash
scriptName: SkyrimNet_Leash_Actions
executionFunctionName: LeashedToTiePoint
parameterMapping:
  - type: speaker
    name: subject
    description: Speaker tying the leash
  - type: dynamic
    name: leashed
    description: Display name of the unleashed actor to tie, exactly as listed under available targets.
    useNearbyActors: false
  - type: dynamic
    name: style
    description: forcefully|normally|gently
  - type: dynamic
    name: leashDistance
    description: tight|short|middle|long
  - type: dynamic
    name: leashType
    description: chain|rope|magic
  - type: dynamic
    name: body_part
    description: neck|waist
  - type: dynamic
    name: tiePoint
    description: floor|left|back|front|right|wall
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: unleashed_nearby
        arguments:
          - currentActor
        comparisonOperator: ==
        expectedValue: "available"
