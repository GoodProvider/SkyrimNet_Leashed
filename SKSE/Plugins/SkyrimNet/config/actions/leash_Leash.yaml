customCategory: LeashFramework
name: Leash
description: Attach a leash from yourself to the target.
questEditorId: SkyrimNet_Leash
scriptName: SkyrimNet_Leash_Actions
executionFunctionName: LeashExecute
parameterMapping:
  - type: speaker
    name: akActor
    description: Speaker holding the leash
  - type: dynamic
    name: target
    description: Actor to leash
  - type: dynamic
    name: style
    description: forceful|normal|gently
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: is_leash_available
        arguments:
          - currentActor
        comparisonOperator: ==
        expectedValue: "available"
