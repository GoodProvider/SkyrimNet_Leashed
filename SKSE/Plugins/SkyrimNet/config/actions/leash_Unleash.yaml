customCategory: LeashFramework
name: Unleash
description: Remove the leash between you and the target, or drop every leash you are part of.
questEditorId: SkyrimNet_Leash
scriptName: SkyrimNet_Leash_Actions
executionFunctionName: UnleashExecute
parameterMapping:
  - type: speaker
    name: akActor
    description: Speaker Actor parameter (triggering entity)
  - type: dynamic
    name: target
    description: Other actor on the leash, if known
    optional: true
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: is_unleash_available
        arguments:
          - currentActor
        comparisonOperator: ==
        expectedValue: "available"
