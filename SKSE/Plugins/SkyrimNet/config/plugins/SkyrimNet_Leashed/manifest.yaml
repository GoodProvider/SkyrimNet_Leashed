plugin:
  name: "SkyrimNet_Leashed"
  version: "0.1.0"
  description: "Leash Framework-SkyrimNet integration"
  icon: "🪢"

schema:
  fields:
    - name: "Enable leash panel hotkey"
      path: "leash.controls.hotkeyEnabled"
      type: "bool"
      description: "Enables the PrismaUI leash panel hotkey."
      defaultValue: false
      category: "Controls"

    - name: "Leash panel hotkey"
      path: "leash.controls.hotkey"
      type: "hotkey"
      description: "Hotkey to open or close the leash panel. Press again or Escape to close."
      min: 1
      max: 255
      required: false
      defaultValue: 220
      category: "Controls"
      supportsOverride: false

    - name: "Leash distance"
      path: "leash.ui.distance"
      type: "select"
      description: "Default leash length used by the panel pulldown and Start."
      defaultValue: "middle"
      options:
        - "tight"
        - "short"
        - "middle"
        - "long"
      category: "Leash"

    - name: "Tight"
      path: "leash.distance.tight"
      type: "int"
      description: "Maximum leash length in game units for the tight distance token."
      min: 50
      max: 2000
      defaultValue: 80
      category: "Leash"

    - name: "Short"
      path: "leash.distance.short"
      type: "int"
      description: "Maximum leash length in game units for the short distance token."
      min: 50
      max: 2000
      defaultValue: 150
      category: "Leash"

    - name: "Middle"
      path: "leash.distance.middle"
      type: "int"
      description: "Maximum leash length in game units for the middle distance token."
      min: 50
      max: 2000
      defaultValue: 220
      category: "Leash"

    - name: "Long"
      path: "leash.distance.long"
      type: "int"
      description: "Maximum leash length in game units for the long distance token."
      min: 50
      max: 2000
      defaultValue: 300
      category: "Leash"

    - name: "Leash type"
      path: "leash.ui.leashType"
      type: "select"
      description: "Default leash type used by the panel pulldown and Start."
      defaultValue: "rope"
      options:
        - "chain"
        - "rope"
        - "magic"
      category: "Leash"

    - name: "Leash body part"
      path: "leash.ui.bodyPart"
      type: "select"
      description: "Default attachment point used by the panel pulldown and Start. Wrists uses Leash_hand_chain; type is forced to chain."
      defaultValue: "neck"
      options:
        - "neck"
        - "wrists"
        - "waist"
      category: "Leash"

    - name: "Tie point"
      path: "leash.ui.tiePoint"
      type: "select"
      description: "Default world anchor used by the panel tie pulldown and Start."
      defaultValue: "floor"
      options:
        - "floor"
        - "left"
        - "back"
        - "front"
        - "right"
        - "wall"
      category: "Leash"

    - name: "Struggle narration interval"
      path: "leash.escape.narrationInterval"
      type: "int"
      description: "Seconds between optional still-struggling DirectNarration attempts. The first struggle line is immediate. DirectNarration also waits for Escape cooldown."
      min: 1
      max: 60
      defaultValue: 5
      category: "Escape"

    - name: "Escape cooldown"
      path: "leash.escape.cooldown"
      type: "int"
      description: "Minimum seconds between struggle DirectNarration lines. Short-lived continue events are unaffected."
      min: 1
      max: 120
      defaultValue: 20
      category: "Escape"
