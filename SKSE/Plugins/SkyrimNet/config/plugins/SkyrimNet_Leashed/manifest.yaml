plugin:
  name: "SkyrimNet_Leashed"
  version: "0.3.0"
  description: "Leash Framework-SkyrimNet integration"
  icon: "🪢"

schema:
  fields:
    - name: "Enable leash panel hotkey"
      path: "leash.controls.hotkeyEnabled"
      type: "bool"
      description: "Enables the PrismaUI leash panel hotkey."
      defaultValue: false
      category: "Controls"

    - name: "Leash panel hotkey"
      path: "leash.controls.hotkey"
      type: "hotkey"
      description: "Hotkey to open or close the leash panel. Press again or Escape to close."
      min: 1
      max: 255
      required: false
      defaultValue: 220
      category: "Controls"
      supportsOverride: false

    - name: "Leash distance"
      path: "leash.ui.distance"
      type: "select"
      description: "Default leash length used by the panel pulldown and Start."
      defaultValue: "middle"
      options:
        - "tight"
        - "short"
        - "middle"
        - "long"
      category: "Leash"

    - name: "Tight settle"
      path: "leash.settle.tight"
      type: "int"
      description: "Stop distance in game units for the tight token (holder standing still)."
      min: 50
      max: 2000
      defaultValue: 50
      category: "Leash"

    - name: "Tight catch-up"
      path: "leash.distance.tight"
      type: "int"
      description: "Catch-up bound in game units for the tight token. While the holder walks, follow gap is 40% of the way from settle to this value."
      min: 50
      max: 2000
      defaultValue: 120
      category: "Leash"

    - name: "Short settle"
      path: "leash.settle.short"
      type: "int"
      description: "Stop distance in game units for the short token (holder standing still)."
      min: 50
      max: 2000
      defaultValue: 90
      category: "Leash"

    - name: "Short catch-up"
      path: "leash.distance.short"
      type: "int"
      description: "Catch-up bound in game units for the short token. While the holder walks, follow gap is 40% of the way from settle to this value."
      min: 50
      max: 2000
      defaultValue: 220
      category: "Leash"

    - name: "Middle settle"
      path: "leash.settle.middle"
      type: "int"
      description: "Stop distance in game units for the middle token (holder standing still)."
      min: 50
      max: 2000
      defaultValue: 150
      category: "Leash"

    - name: "Middle catch-up"
      path: "leash.distance.middle"
      type: "int"
      description: "Catch-up bound in game units for the middle token. While the holder walks, follow gap is 40% of the way from settle to this value."
      min: 50
      max: 2000
      defaultValue: 380
      category: "Leash"

    - name: "Long settle"
      path: "leash.settle.long"
      type: "int"
      description: "Stop distance in game units for the long token (holder standing still)."
      min: 50
      max: 2000
      defaultValue: 240
      category: "Leash"

    - name: "Long catch-up"
      path: "leash.distance.long"
      type: "int"
      description: "Catch-up bound in game units for the long token. While the holder walks, follow gap is 40% of the way from settle to this value."
      min: 50
      max: 2000
      defaultValue: 580
      category: "Leash"

    - name: "Leash type"
      path: "leash.ui.leashType"
      type: "select"
      description: "Default leash type used by the panel pulldown and Start."
      defaultValue: "rope"
      options:
        - "chain"
        - "rope"
        - "magic"
      category: "Leash"

    - name: "Leash body part"
      path: "leash.ui.bodyPart"
      type: "select"
      description: "Default attachment point used by the panel pulldown and Start. Wrists forces type to chain. Wrist mesh is Leash_hand_chain (tight/short), Leash_hand_chain_long (middle), or Leash_hand_chain_xlong (long)."
      defaultValue: "neck"
      options:
        - "neck"
        - "wrists"
        - "waist"
      category: "Leash"

    - name: "Tie point"
      path: "leash.ui.tiePoint"
      type: "select"
      description: "Default world anchor used by the panel tie pulldown and Start."
      defaultValue: "floor"
      options:
        - "floor"
        - "left"
        - "back"
        - "front"
        - "right"
        - "wall"
      category: "Leash"

    - name: "Enable struggle"
      path: "leash.escape.enabled"
      type: "bool"
      description: "Lets leashed speakers pick Escape struggle and loop the struggle idle. Off hides those actions and stops anyone already struggling."
      defaultValue: true
      category: "Escape"

    - name: "Struggle narration interval"
      path: "leash.escape.narrationInterval"
      type: "int"
      description: "Seconds between optional still-struggling DirectNarration attempts. The first struggle line is immediate. DirectNarration also waits for Escape cooldown."
      min: 1
      max: 60
      defaultValue: 5
      category: "Escape"

    - name: "Escape cooldown"
      path: "leash.escape.cooldown"
      type: "int"
      description: "Minimum seconds between struggle DirectNarration lines. Short-lived continue events are unaffected."
      min: 1
      max: 120
      defaultValue: 20
      category: "Escape"
