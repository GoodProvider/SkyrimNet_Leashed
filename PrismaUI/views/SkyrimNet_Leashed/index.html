<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SkyrimNet Leashed</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        :root {
            --bg-surface:    rgba(33, 33, 38, 0.94);
            --bg-input:      rgba(28, 28, 33, 0.92);
            --text-primary:  #e8e6e1;
            --text-secondary:#a8a5a0;
            --text-muted:    #65635e;
            --accent:        #c9a84c;
            --accent-muted:  rgba(201, 168, 76, 0.15);
            --border:        rgba(201, 168, 76, 0.28);
            --font-ui:       'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', system-ui, sans-serif;
            --text-sm:       26px;
            --text-base:     30px;
            --space-xs:      4px;
            --space-sm:      8px;
            --space-md:      12px;
            --radius:        6px;
            --target-min:    80px;
            --shadow-lg:     0 6px 16px rgba(0, 0, 0, 0.45);
        }
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            width: 100%;
            height: 100%;
            user-select: none;
            color: var(--text-primary);
            font-family: var(--font-ui);
            font-size: var(--text-base);
        }
        /* Panel + cascade columns to its right (SkyrimNet_SexLab TargetMenu pulldown_cascade model). */
        #leash-root {
            display: none;
            position: absolute;
            top: 10%;
            left: 10%;
            flex-direction: row;
            align-items: flex-start;
            gap: var(--space-md);
            max-width: 80vw;
            pointer-events: auto;
        }
        #leash-root.open { display: flex; }
        .panel {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: var(--space-sm) var(--space-md);
            flex: 0 0 auto;
            max-height: 80vh;
            overflow-y: auto;
        }
        #leash-panel { min-width: min(320px, 40vw); }
        .cascade-col {
            min-width: min(240px, 30vw);
            max-width: min(360px, 40vw);
        }
        .section-header {
            font-size: var(--text-sm);
            color: var(--text-muted);
            letter-spacing: 0.10em;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            padding-bottom: var(--space-xs);
            margin: var(--space-xs) 0;
        }
        .top-bar {
            display: flex;
            gap: var(--space-md);
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: var(--space-sm);
            margin-bottom: var(--space-sm);
        }
        .top-bar .pulldown { width: auto; min-width: 8em; }
        .labeled-fields {
            display: grid;
            grid-template-columns: max-content minmax(8em, 1fr);
            column-gap: var(--space-sm);
            row-gap: var(--space-xs);
            align-items: center;
        }
        .dyn-field { display: contents; }
        .dyn-field > label {
            font-size: var(--text-sm);
            color: var(--text-muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .dyn-field > .pulldown,
        .dyn-field > span {
            justify-self: stretch;
            min-width: 8em;
        }
        .dyn-field > span { color: var(--text-secondary); }
        .dyn-field.disabled > * {
            opacity: 0.45;
            pointer-events: none;
        }
        .pulldown {
            position: relative;
            width: 100%;
            min-width: 0;
        }
        .pulldown-value {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0 var(--space-sm);
            min-height: var(--target-min);
            display: flex;
            align-items: center;
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
            cursor: pointer;
        }
        .pulldown-value:hover,
        .pulldown.cascade-open .pulldown-value {
            border-color: rgba(201, 168, 76, 0.45);
        }
        .pulldown-cascade .pulldown-value::after {
            content: '❯';
            margin-left: auto;
            padding-left: var(--space-sm);
            opacity: 0.6;
        }
        .option-row {
            display: flex;
            align-items: stretch;
            gap: var(--space-xs);
        }
        .option-row .option { flex: 1; min-width: 0; }
        .option {
            color: var(--text-primary);
            cursor: pointer;
            padding: var(--space-sm) var(--space-sm) var(--space-sm) var(--space-md);
            min-height: var(--target-min);
            display: flex;
            align-items: center;
            white-space: nowrap;
        }
        .option:hover,
        .option.selected {
            color: var(--accent);
            box-shadow: inset 2px 0 0 var(--accent);
        }
        .option.disabled {
            color: var(--text-muted);
            cursor: default;
            pointer-events: none;
            opacity: 0.55;
        }
        .option-expand {
            font-size: var(--text-sm);
            color: var(--text-secondary);
            cursor: pointer;
            padding: var(--space-sm) var(--space-md);
            min-height: var(--target-min);
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }
        .option-expand:hover,
        .option-row.selected .option-expand {
            color: var(--accent);
            background: var(--accent-muted);
        }
        .action-btn {
            color: var(--accent);
            cursor: pointer;
            padding: var(--space-xs) var(--space-md);
            min-height: var(--target-min);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            min-width: 5.5em;
        }
        .action-btn:hover { background: var(--accent-muted); }
        .action-btn.disabled {
            color: var(--text-muted);
            cursor: default;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="leash-root"></div>
    <script>
        const STYLES = ['forcefully', 'normally', 'gently'];
        const DISTANCES = ['tight', 'short', 'middle', 'long'];
        const TYPES = ['chain', 'rope', 'magic'];
        const BODY_PARTS = ['neck', 'wrists', 'waist'];
        const TIE_POINTS = ['floor', 'left', 'back', 'front', 'right', 'wall'];
        const NONE_ID = 0;
        const HOVER_DELAY_MS = 150;

        let state = {
            actors: [],
            player: 0,
            crosshair: 0,
            subject: 0,
            leashed: 0,
            holder: 0,
            verb: 'leash',
            style: 'normally',
            distance: 'middle',
            leashType: 'rope',
            bodyPart: 'neck',
            tiePoint: 'floor'
        };

        // Open cascade: { key, path } (branch index per column); specs rebuilt each render.
        let cascade = null;
        let cascadeSpecs = {};
        let hoverTimer = null;

        function formId(v) { return (v >>> 0); }

        function findActor(id) {
            const fid = formId(id);
            if (!fid) return null;
            return state.actors.find(a => formId(a.formId) === fid) || null;
        }

        function leashedRecord() {
            return findActor(state.leashed);
        }

        function isLeashed() {
            const rec = leashedRecord();
            return !!(rec && rec.isLeashed);
        }

        function verbValues() {
            if (!isLeashed()) return ['leash', 'leash to'];
            return ['unleash', 'tie to', 'give to'];
        }

        function hasHolder() {
            const rec = leashedRecord();
            return !!(rec && rec.holderFormId);
        }

        function seedVerb() {
            const allowed = verbValues();
            if (!allowed.includes(state.verb))
                state.verb = allowed[0];
        }

        function lockWristType() {
            if (state.bodyPart === 'wrists')
                state.leashType = 'chain';
        }

        // Existing leash: adopt its kind / distance / body so re-tie or give keeps them.
        function seedFromRecord() {
            const rec = leashedRecord();
            if (rec && rec.isLeashed) {
                if (TYPES.includes(rec.kind)) state.leashType = rec.kind;
                if (DISTANCES.includes(rec.distance)) state.distance = rec.distance;
                if (BODY_PARTS.includes(rec.bodyPart)) state.bodyPart = rec.bodyPart;
            }
        }

        function actorEntries(includeNone, excludeId) {
            const skip = formId(excludeId);
            const entries = [];
            if (includeNone)
                entries.push({ formId: NONE_ID, name: 'None' });
            state.actors.forEach((a) => {
                if (skip && formId(a.formId) === skip) return;
                entries.push(a);
            });
            return entries;
        }

        function actorName(id) {
            if (!formId(id)) return 'None';
            const rec = findActor(id);
            return rec ? (rec.name || '?') : '?';
        }

        // ── pulldown_cascade (ported from SkyrimNet_SexLab createPulldownCascade) ──
        // Looks like a pulldown showing the value, but opens columns right of the panel
        // (hover drill, ❯ branches, ‹ back header). spec: { key, caption, display,
        // tree: [{ label, value, children, current, disabled }], onPick(node) }.

        function bindHoverDrill(el, isOpen, drill) {
            el.addEventListener('mouseenter', () => {
                clearTimeout(hoverTimer);
                if (isOpen()) return;
                hoverTimer = setTimeout(() => {
                    if (!isOpen()) drill();
                }, HOVER_DELAY_MS);
            });
            el.addEventListener('mouseleave', () => clearTimeout(hoverTimer));
        }

        function createPulldownCascade(spec, disabled) {
            cascadeSpecs[spec.key] = spec;
            const isOpen = () => !!cascade && cascade.key === spec.key;
            const root = document.createElement('div');
            root.className = 'pulldown pulldown-cascade' + (isOpen() ? ' cascade-open' : '');
            const valueEl = document.createElement('div');
            valueEl.className = 'pulldown-value';
            valueEl.textContent = spec.display || '—';
            root.appendChild(valueEl);
            if (disabled) return root;
            const open = () => {
                cascade = { key: spec.key, path: [] };
                render();
            };
            valueEl.onclick = (e) => {
                e.stopPropagation();
                if (isOpen()) {
                    cascade = null;
                    render();
                } else {
                    open();
                }
            };
            bindHoverDrill(root, isOpen, open);
            return root;
        }

        function cascadeNodes(spec, level) {
            let nodes = spec.tree || [];
            for (let i = 0; i < level; i++) {
                const n = nodes[cascade.path[i]];
                if (!n || !n.children) return null;
                nodes = n.children;
            }
            return nodes;
        }

        function cascadeRow(spec, node, idx, level) {
            const deeperOpen = () => !!cascade && cascade.key === spec.key && cascade.path.length > level;
            if (node.children) {
                const isOpen = () => !!cascade && cascade.key === spec.key && cascade.path[level] === idx;
                const drill = () => {
                    if (!cascade) return;
                    cascade.path = cascade.path.slice(0, level).concat([idx]);
                    render();
                };
                const row = document.createElement('div');
                row.className = 'option-row' + (isOpen() ? ' selected' : '');
                const main = document.createElement('div');
                main.className = 'option' + (isOpen() || node.current ? ' selected' : '');
                main.textContent = node.label;
                main.onclick = (e) => {
                    e.stopPropagation();
                    drill();
                };
                const expand = document.createElement('div');
                expand.className = 'option-expand';
                expand.textContent = '❯';
                expand.onclick = (e) => {
                    e.stopPropagation();
                    drill();
                };
                bindHoverDrill(row, isOpen, drill);
                row.appendChild(main);
                row.appendChild(expand);
                return row;
            }
            const row = document.createElement('div');
            row.className = 'option' + (node.current ? ' selected' : '') + (node.disabled ? ' disabled' : '');
            row.textContent = node.label;
            if (node.disabled) return row;
            row.onclick = (e) => {
                e.stopPropagation();
                cascade = null;
                spec.onPick(node);
            };
            // Resting on a leaf folds columns opened from a sibling branch.
            bindHoverDrill(row, () => !deeperOpen(), () => {
                if (!cascade) return;
                cascade.path = cascade.path.slice(0, level);
                render();
            });
            return row;
        }

        function renderCascadeColumns(host) {
            if (!cascade) return;
            const spec = cascadeSpecs[cascade.key];
            if (!spec) {
                cascade = null;
                return;
            }
            for (let level = 0; level <= cascade.path.length; level++) {
                const nodes = cascadeNodes(spec, level);
                if (!nodes) break;
                const panel = document.createElement('div');
                panel.className = 'panel cascade-col';
                panel.onclick = (e) => e.stopPropagation();
                const header = document.createElement('div');
                header.className = 'section-header';
                if (level > 0) {
                    const parent = cascadeNodes(spec, level - 1)[cascade.path[level - 1]];
                    header.textContent = '‹ ' + (parent ? parent.label : '');
                    header.style.cursor = 'pointer';
                    header.onclick = (e) => {
                        e.stopPropagation();
                        cascade.path = cascade.path.slice(0, level - 1);
                        render();
                    };
                } else {
                    header.textContent = spec.caption || spec.key;
                }
                panel.appendChild(header);
                nodes.forEach((node, idx) => panel.appendChild(cascadeRow(spec, node, idx, level)));
                host.appendChild(panel);
            }
        }

        // Escape: peel one column, then close. True when a cascade was open.
        function peelCascade() {
            if (!cascade) return false;
            if (cascade.path.length) cascade.path = cascade.path.slice(0, -1);
            else cascade = null;
            render();
            return true;
        }

        function listCascade(key, caption, values, current, onPick, disabled) {
            return createPulldownCascade({
                key: key,
                caption: caption,
                display: current,
                tree: values.map(v => ({ label: v, value: v, current: v === current })),
                onPick: (node) => onPick(node.value)
            }, disabled);
        }

        function actorNodes(includeNone, excludeId, currentId) {
            const cur = formId(currentId);
            return actorEntries(includeNone, excludeId).map(a => ({
                label: a.name || '?',
                value: formId(a.formId),
                current: formId(a.formId) === cur
            }));
        }

        function actorCascade(key, caption, currentId, onPick) {
            return createPulldownCascade({
                key: key,
                caption: caption,
                display: actorName(currentId),
                tree: actorNodes(false, 0, currentId),
                onPick: (node) => onPick(node.value)
            });
        }

        // ── action row: verb → object tree; a leaf sets verb + holder/tiePoint and starts at once ──

        function tieNodes(verb) {
            return TIE_POINTS.map(t => ({
                label: t,
                value: { verb: verb, tiePoint: t },
                current: state.verb === verb && state.tiePoint === t
            }));
        }

        function holderNodes(verb, includeNone) {
            const cur = state.verb === verb ? state.holder : -1;
            return actorNodes(includeNone, state.leashed, cur).map(n => ({
                label: n.label,
                value: { verb: verb, holder: n.value },
                current: n.current
            }));
        }

        function actionDisplay() {
            switch (state.verb) {
                case 'leash': return 'leash: held by ' + actorName(state.holder);
                case 'leash to': return 'leash to: ' + state.tiePoint;
                case 'tie to': return 'tie to: ' + state.tiePoint;
                case 'give to': return 'give to: ' + actorName(state.holder);
                default: return state.verb;
            }
        }

        function actionCascade() {
            const branch = (verb, children) => ({ label: verb, current: state.verb === verb, children: children });
            const tree = isLeashed()
                ? [
                    { label: 'unleash', value: { verb: 'unleash' }, current: state.verb === 'unleash' },
                    branch('tie to', tieNodes('tie to')),
                    branch('give to', holderNodes('give to', false))
                ]
                : [
                    branch('leash', holderNodes('leash', true)),
                    branch('leash to', tieNodes('leash to'))
                ];
            return createPulldownCascade({
                key: 'action',
                caption: 'action',
                display: actionDisplay(),
                tree: tree,
                onPick: (node) => {
                    const v = node.value || {};
                    state.verb = v.verb;
                    if (v.holder !== undefined) state.holder = v.holder;
                    if (v.tiePoint) state.tiePoint = v.tiePoint;
                    render();
                    fireStart();
                }
            });
        }

        function canStart() {
            if (!state.subject || !state.leashed) return false;
            if ((state.verb === 'leash' || state.verb === 'give to')
                && state.holder && formId(state.holder) === formId(state.leashed))
                return false;
            if (state.verb === 'give to' && !state.holder) return false;
            return true;
        }

        function fireStart() {
            if (!canStart()) return;
            lockWristType();
            const payload = {
                action: state.verb,
                subject: formId(state.subject),
                leashed: formId(state.leashed),
                holder: formId(state.holder),
                style: state.style || 'normally',
                distance: state.distance || 'middle',
                leashType: state.leashType || 'rope',
                bodyPart: state.bodyPart || 'neck',
                tiePoint: state.tiePoint || 'floor'
            };
            if (typeof window.onStart === 'function')
                window.onStart(JSON.stringify(payload));
        }

        // Layout: [Start] style / subject / leashed / (status) / action / distance / type / body.
        function render() {
            seedVerb();
            lockWristType();
            const rec = leashedRecord();
            if (state.holder && formId(state.holder) === formId(state.leashed))
                state.holder = state.subject || 0;

            const root = document.getElementById('leash-root');
            root.innerHTML = '';
            cascadeSpecs = {};
            const panel = document.createElement('div');
            panel.id = 'leash-panel';
            panel.className = 'panel';
            // Clicks inside the panel (off a field) close an open cascade, not the overlay.
            panel.onclick = (e) => {
                e.stopPropagation();
                if (!cascade) return;
                cascade = null;
                render();
            };

            const bar = document.createElement('div');
            bar.className = 'top-bar';
            const startBtn = document.createElement('div');
            startBtn.className = 'action-btn' + (canStart() ? '' : ' disabled');
            startBtn.textContent = 'Start';
            startBtn.onclick = (e) => {
                e.stopPropagation();
                fireStart();
            };
            bar.appendChild(startBtn);
            bar.appendChild(listCascade('style', 'style', STYLES, state.style, (v) => {
                state.style = v;
                render();
            }));
            panel.appendChild(bar);

            const fields = document.createElement('div');
            fields.className = 'labeled-fields';
            const addField = (labelText, node, disabled) => {
                const field = document.createElement('div');
                field.className = 'dyn-field' + (disabled ? ' disabled' : '');
                const lab = document.createElement('label');
                lab.textContent = labelText || ' ';
                field.appendChild(lab);
                if (node) field.appendChild(node);
                fields.appendChild(field);
            };

            addField('subject', actorCascade('subject', 'subject', state.subject, (id) => {
                state.subject = id;
                render();
            }));
            addField('leashed', actorCascade('leashed', 'leashed', state.leashed, (id) => {
                state.leashed = id;
                seedFromRecord();
                render();
            }));

            const leashedNow = isLeashed();
            if (leashedNow) {
                const st = document.createElement('span');
                st.textContent = rec.holderFormId ? (rec.holderName || '?') : 'world';
                addField(rec.holderFormId ? 'is leashed by' : 'is tied to', st);
            }

            addField('action', actionCascade());

            // New leash only; an existing leash keeps its settings.
            if (!leashedNow) {
                addField('distance', listCascade('distance', 'distance', DISTANCES, state.distance, (v) => {
                    state.distance = v;
                    render();
                }));
                const wrists = state.bodyPart === 'wrists';
                addField('type', listCascade('type', 'type', TYPES, state.leashType, (v) => {
                    state.leashType = v;
                    render();
                }, wrists), wrists);
                addField('body', listCascade('body', 'body', BODY_PARTS, state.bodyPart, (v) => {
                    state.bodyPart = v;
                    lockWristType();
                    render();
                }));
            }

            panel.appendChild(fields);
            root.appendChild(panel);
            renderCascadeColumns(root);
            root.classList.add('open');
        }

        function openLeashPanel(payload) {
            const src = payload && typeof payload === 'object' ? payload : {};
            state.actors = Array.isArray(src.actors) ? src.actors : [];
            state.player = formId(src.player);
            state.crosshair = formId(src.crosshair);
            state.distance = DISTANCES.includes(src.distance) ? src.distance : 'middle';
            state.leashType = TYPES.includes(src.leashType) ? src.leashType : 'rope';
            state.bodyPart = BODY_PARTS.includes(src.bodyPart) ? src.bodyPart : 'neck';
            state.tiePoint = TIE_POINTS.includes(src.tiePoint) ? src.tiePoint : 'floor';
            if (!STYLES.includes(state.style)) state.style = 'normally';

            const playerActor = findActor(state.player) || state.actors[0];
            const crossActor = findActor(state.crosshair);
            const presetLeashed = formId(src.presetLeashed);
            state.subject = playerActor ? formId(playerActor.formId) : 0;
            if (presetLeashed && findActor(presetLeashed)) {
                state.leashed = presetLeashed;
            } else if (crossActor && formId(crossActor.formId) !== state.subject) {
                state.leashed = formId(crossActor.formId);
            } else if (playerActor && playerActor.isLeashed) {
                state.leashed = state.subject;
            } else {
                state.leashed = formId((state.actors.find(a => formId(a.formId) !== state.subject) || playerActor || { formId: 0 }).formId);
            }
            state.holder = state.subject;
            seedFromRecord();
            if (src.presetVerb)
                state.verb = String(src.presetVerb);
            cascade = null;
            lockWristType();
            seedVerb();
            render();
        }

        document.addEventListener('click', () => {
            if (!cascade) return;
            cascade = null;
            render();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && peelCascade()) {
                e.preventDefault();
                e.stopImmediatePropagation();
            }
        });
        window.openLeashPanel = openLeashPanel;
    </script>
</body>
</html>
